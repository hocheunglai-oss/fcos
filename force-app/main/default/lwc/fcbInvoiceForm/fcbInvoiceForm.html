<template>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-label="Meaningful description of the modal content" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <template if:false={actionExecuted}>
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </template>
                <header class="slds-modal__header slds-modal__header_empty">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                                        alternative-text="close"
                                        variant="inverse"
                                        size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template if:true={readinessBannerVisible}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                            <span>{variableChargeReadinessReason}</span>
                            <a class="slds-m-left_small" href={variableChargeFcosUrl} target="_blank" rel="noopener">Open FCOS task</a>
                        </div>
                    </template>
                    <div class="slds-grid slds-gutters slds-wrap">
                        <lightning-input class="slds-col slds-size_1-of-2" value={vesselText} label="Vessel Text" onchange={handleChangeVesselText}></lightning-input>
                        <lightning-input class="slds-col slds-size_1-of-2" value={invoiceNumber} label={invoiceNumberLabel} onchange={handleChangeInvoiceNumber}></lightning-input>
                        <lightning-input class="slds-col slds-size_1-of-2" value={buyerName} label="Buyer" onchange={handleChangeBuyerName}></lightning-input>
                        <lightning-input class="slds-col slds-size_1-of-2" value={todayDate} label={todayDateLabel} onchange={handleChangeTodayDate}></lightning-input>
                        <template if:true={isExtraCostOnly}>
                            <lightning-input class="slds-col slds-size_1-of-2" type="date" date-style="short"
                                value={serviceDeliveryDateValue} label="Service / Delivery Date (optional)"
                                onchange={handleChangeServiceDeliveryDate}
                                field-level-help="Used only on this Buyer Invoice and its PDF. It does not update the STEM Delivery Date or Variable Charges readiness.">
                            </lightning-input>
                        </template>
                        <template if:true={poVoyageNumberNeeded}>
                            <div class="slds-col slds-size_1-of-2"></div>
                            <lightning-input class="slds-col slds-size_1-of-2" value={poVoyageNumber} label="PO/Voyage Number" onchange={handleChangePoVoyageNumber}></lightning-input>
                        </template>
                        <template if:true={brokerName}>
                            <lightning-input class="slds-col slds-size_1-of-2" value={brokerName} label="Broker" onchange={handleChangeBrokerName}></lightning-input>
                        </template>
                    </div>
                    <lightning-textarea class="slds-col slds-size_6-of-12" label="Address" value={address} onchange={handleChangeAddress}></lightning-textarea>
                    <div class="slds-grid slds-gutters">
                        <lightning-input class="slds-col slds-size_1-of-2" value={attn.label} onchange={handleChangeAttnLabel}></lightning-input>
                        <lightning-input class="slds-col slds-size_1-of-2" value={attn.value} onchange={handleChangeAttnValue}></lightning-input>
                    </div>
                    <lightning-input value={infoText} onchange={handleChangeInfoText}></lightning-input>
                    <hr/>
                    <template for:each={productInputs} for:item="input">
                        <template if:false={input.isDisabled}>
                            <template if:false={input.isHidden}>
                                <div class="slds-grid slds-gutters" key={input.id} draggable="true" ondragstart={handleDragProductStart} ondragover={handleDragProductOver} ondrop={handleProductDrop} data-id={input.id}>
                                    <lightning-input class="slds-col slds-size_3-of-12" value={input.name} onchange={handleChangeProductName} data-id={input.id}></lightning-input>
                                    <lightning-input class="slds-col slds-size_2-of-12" value={input.quantity} onchange={handleChangeProductQuantity} data-id={input.id}></lightning-input>
                                    <lightning-input class="slds-col slds-size_2-of-12" type="number" step=".01" value={input.unitPrice} onchange={handleChangeProductUnitPrice} data-id={input.id}></lightning-input>
                                    <lightning-input class="slds-col slds-size_2-of-12" type="number" step=".01" value={input.amount} onchange={handleChangeProductAmount} data-id={input.id}></lightning-input>
                                    <lightning-button onclick={removeProductInput} data-id={input.id}
                                                    variant="base" title="Remove Product" icon-name="utility:close"
                                                    class="slds-col slds-size_1-of-12 slds-m-top_x-small slds-m-left_small">
                                    </lightning-button>
                                </div>
                            </template>
                        </template>
                    </template>
                    <div class="slds-m-top_small">
                        <lightning-button-icon size="x-small" icon-name="utility:add" variant="brand"
                                            alternative-text="Add Product" onclick={addNewProduct}>
                        </lightning-button-icon>
                    </div>

                    <div class="slds-grid slds-gutters">
                        <lightning-input class="slds-col slds-size_3-of-12" value={total.name} onchange={handleChangeTotalName}></lightning-input>
                        <lightning-input class="slds-col slds-size_2-of-12" disabled></lightning-input>
                        <lightning-input class="slds-col slds-size_2-of-12" disabled></lightning-input>
                        <lightning-input class="slds-col slds-size_2-of-12" type="number" step=".01" value={total.amount} onchange={handleChangeTotalAmount}></lightning-input>
                    </div>
                    <template if:true={showBalanceRows}>
                        <template if:true={balance} for:each={balance} for:item="balanceRow" for:index="index">
                           <div class="slds-grid slds-gutters" key={balanceRow.id}>
                                <lightning-input class="slds-col slds-size_3-of-12" value={balanceRow.name} data-id={balanceRow.id} onchange={handleChangeBalanceName}></lightning-input>
                                <lightning-input class="slds-col slds-size_2-of-12" disabled></lightning-input>
                                <lightning-input class="slds-col slds-size_2-of-12" disabled></lightning-input>
                                <lightning-input class="slds-col slds-size_2-of-12" type="number" step=".01" value={balanceRow.amount} data-id={balanceRow.id} onchange={handleChangeBalanceAmount}></lightning-input>
                            </div>
                        </template>

                    </template>
                    <hr/>
                    <template if:false={isCreditNote}>
                        <template for:each={inputs} for:item="input">
                            <template if:false={input.isDisabled}>
                                <template if:false={input.isHidden}>
                                    <div class="slds-grid slds-gutters" key={input.id} draggable="true" ondragstart={handleDragStart} ondragover={handleDragOver} ondrop={handleDrop} data-id={input.id}>
                                        <lightning-input class="slds-col slds-size_5-of-12" value={input.label} onchange={handleChangeInputLabel} data-id={input.id}></lightning-input>
                                        <lightning-input class="slds-col slds-size_5-of-12" value={input.value} onchange={handleChangeInputValue} data-id={input.id}></lightning-input>
                                        <lightning-button onclick={removeInput} data-id={input.id}
                                            variant="base" title="Remove Input" icon-name="utility:close"
                                            class="slds-col slds-size_1-of-12 slds-m-top_x-small slds-m-left_small"></lightning-button>
                                    </div>
                                </template>
                            </template>
                        </template>
                        <div class="slds-m-top_small">
                            <lightning-button-icon size="x-small" icon-name="utility:add" variant="brand"
                                                    alternative-text="Add Input" onclick={addNewInput}>
                            </lightning-button-icon>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={handleGeneratePDF} title="Generate" disabled={isGenerateDisabled}>Generate</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
