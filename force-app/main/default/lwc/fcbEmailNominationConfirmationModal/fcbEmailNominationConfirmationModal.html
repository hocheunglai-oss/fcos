<template>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-label="Meaningful description of the modal content" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <template if:false={actionExecuted}>
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </template>
                <header class="slds-modal__header slds-modal__header_empty">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                                        alternative-text="close"
                                        variant="inverse"
                                        size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="slds-p-around_medium">
                        <lightning-input name="toAddress" type="email" label="To Addresses" placeholder="type here..." value={emailTemplate.toAddress} required onchange={handleInputChange} multiple></lightning-input>
                        <lightning-input name="toCCAddress" type="email" label="To CC Addresses" placeholder="type here..." value={emailTemplate.toCCAddress} onchange={handleInputChange} multiple></lightning-input>
                        <lightning-input name="toBCCAddress" type="email" label="To BCC Addresses" placeholder="type here..." value={emailTemplate.toBCCAddress} onchange={handleInputChange} multiple></lightning-input>
                        <lightning-input name="subject" type="text" label="Subject" value={emailTemplate.subject} onchange={handleInputChange}></lightning-input>
                        <br/>
                        <lightning-datatable key-field="docUrl" columns={columns} data={additionalFiles}></lightning-datatable>
                        <br/>
                        <lightning-textarea name="textBody" label="Email Body Text" value={emailTemplate.textBody} onchange={handleInputChange}></lightning-textarea>
                        <br/>
                        <c-modal-free-file-upload label="Upload file"
                                                  file-purpose={filePurpose}
                                                  onuploadfinished={handleUploadFinished}
                                                  record-id={recordId}>
                        </c-modal-free-file-upload>
                        <template if:true={isBuyerConfirmation}>
                            <lightning-record-edit-form object-api-name="Enquiry_Special_Term__c" onsubmit={handleEnquirySpecialTermSubmit} onsuccess={handleEnquirySpecialTermSuccess}>
                                <div class="slds-grid slds-gutters">
                                    <div class="slds-col">
                                        <lightning-input-field field-name="Special_Term__c" variant="label-stacked"></lightning-input-field>
                                    </div>
                                    <div class="slds-col" style="margin-top: 21px;">
                                        <lightning-button variant="brand" type="submit" label="Add">
                                        </lightning-button>
                                    </div>
                                </div>
                            </lightning-record-edit-form>
                        </template>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={sendEmail} title="Send" disabled={isSendButtonDisabled}>Send Email</button>

                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
