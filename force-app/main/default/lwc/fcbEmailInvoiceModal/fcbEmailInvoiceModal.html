<template>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-label="Invoice email" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <template if:false={actionExecuted}>
                    <lightning-spinner alternative-text="Sending invoice email"></lightning-spinner>
                </template>
                <header class="slds-modal__header slds-modal__header_empty">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal} disabled={isSending}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>
                <div class="slds-modal__content" id="modal-content-id-1">
                    <div class="slds-p-around_medium">
                        <template if:true={hasOperationError}>
                            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                                <span>{operationError}</span>
                                <template if:true={fcosTaskUrl}>
                                    <a class="slds-m-left_small" href={fcosTaskUrl} target="_blank" rel="noopener noreferrer">{fcosTaskLabel}</a>
                                </template>
                            </div>
                        </template>
                        <lightning-input name="toAddress" type="email" label="To Addresses" placeholder="type here..." value={emailTemplate.toAddress} required onchange={handleInputChange} multiple disabled={isSending}></lightning-input>
                        <lightning-input name="toCCAddress" type="email" label="To CC Addresses" placeholder="type here..." value={emailTemplate.toCCAddress} onchange={handleInputChange} multiple disabled={isSending}></lightning-input>
                        <lightning-input name="toBCCAddress" type="email" label="To BCC Addresses" placeholder="type here..." value={emailTemplate.toBCCAddress} onchange={handleInputChange} multiple disabled={isSending}></lightning-input>
                        <lightning-input name="subject" type="text" label="Subject" value={emailTemplate.subject} onchange={handleInputChange} disabled={isSending}></lightning-input>
                        <br />
                        <c-fcb-email-stem-line-item current-stem={currentStem} invoices={selectedItems} record-id={recordId}></c-fcb-email-stem-line-item>
                        <br />
                        <lightning-textarea name="textBody" label="Email Body Text" value={emailTemplate.textBody} onchange={handleInputChange} disabled={isSending}></lightning-textarea>
                        <br />
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel" disabled={isSending}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={sendEmail} title="Send" disabled={isSendDisabled}>Send Email</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
