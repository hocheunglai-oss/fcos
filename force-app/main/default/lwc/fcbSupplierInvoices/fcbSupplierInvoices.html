<template>
  <lightning-card>
    <div class="slds-grid">
      <div class="slds-col slds-size_1-of-2">
        <h3 slot="title">Invoicing Info (From Suppliers)</h3>
      </div>
      <div class="slds-col slds-size_1-of-2">
        <lightning-input type="text" disabled label="Calculated Total" variant="label-stacked"
          value={totalSumForSupplierText}></lightning-input>
      </div>
    </div>
  
    <div>
      <template if:false={isSaved}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
      </template>
        <lightning-input type="date" label="Invoice Date" date-style="short" variant="label-stacked"
          value={invoiceDateValue} onchange={handleChangeInvoiceDate} required>
        </lightning-input>
        <div class="slds-grid">
          <div class="slds-col slds-size_1-of-2">
            <lightning-input label="Name" value={invoiceNumber} onchange={handleChangeInvoiceNumber} variant="label-stacked" required>
            </lightning-input>
            <lightning-combobox name="suplierpicklist" label="Supplier" value={optionValue} placeholder="Select Supplier"
              options={options} required="true" onchange={handleChange}>
            </lightning-combobox>
            <template if:true={supplierVariableChargeReadiness}>
              <template if:false={supplierVariableChargeReadiness.ready}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_x-small" role="alert">
                  <span>{supplierVariableChargeReadiness.reason}</span>
                  <a class="slds-m-left_small" href={supplierVariableChargeReadiness.fcosUrl} target="_blank" rel="noopener">Open Variable Charges in FCOS</a>
                </div>
              </template>
            </template>
  
            <lightning-combobox name="bankDetailsPicklist" label="Bank Details" value={bankDetailsValue}
              placeholder="Select Bank Details" options={bankDetailOptions} onchange={handleBankDetailChange}
              required="true" class="slds-m-top_x-small">
            </lightning-combobox>
          </div>
  
  
          <div class="slds-col slds-size_1-of-2">
            <lightning-input variant="label-stacked" type="number" formatter="currency" label="Invoice Amount"
              value={invoiceAmountValue} onchange={handleChangeInvoiceAmount} required step="0.01">
            </lightning-input>
            <template if:true={partialCIA}>
              <lightning-input label="Partial CIA Amount" type="number" formatter="currency"
                value={partialAmount} onchange={handleChangePartialAmount} step="0.01"
                variant="label-stacked" required>
              </lightning-input>
            </template>
            <lightning-input type="date" label="Supplier Delivery Date" date-style="short" variant="label-stacked"
              value={deliveryDateValue} onchange={handleChangeDeliveryDate} required>
            </lightning-input>
            <template if:true={fcbsReferenceVisible}>
              <lightning-input label="FCBS Reference" value={fcbsReference} onchange={handleChangeFcbsReference} max-length="15"
                variant="label-stacked" required>
              </lightning-input> 
          </template> 
          </div>   
        </div>
        <template if:true={productInfo}>
          <lightning-datatable class="product-info" columns={productColumns} data={productInfo} key-field="id"
           onrowselection={handleProductChange} selected-rows={selectedProducts}></lightning-datatable>
        </template>
        <div class="slds-grid">
          <c-fcb-file-upload-binder uploader-label="Invoice" uploader-value={invoiceNumber}></c-fcb-file-upload-binder>
        </div>
        <div class="slds-grid">
          <lightning-button class="slds-var-m-top_small slds-column" variant="brand" onclick={handleSubmit} name="createSEC"
            label="Create Supplier Invoice" disabled={supplierInvoiceCreateDisabled}>
          </lightning-button>
        </div>
    </div>
  </lightning-card>
</template>
