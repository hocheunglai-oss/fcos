<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <template if:true={actionExecuting}>
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </template>
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                    onclick={closeModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small">
                    </lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{modalTitle}</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <div class="slds-text-body_regular">
                    Please enter quote details as they should appear for the buyer, they maybe edited later.
                </div>
                <template if:true={currentOfferLineItem}>
                    <lightning-record-edit-form object-api-name="QuoteLineItem" record-id={currentOfferLineItem.Id}
                        onsubmit={handleSubmitForm} onerror={handleErrorForm} onsuccess={handleQuoteLineItemAdded}
                        onchange={handleQuoteLineItemChange}>
                        <lightning-messages></lightning-messages>
                        <lightning-input-field field-name="QuoteId" value={recordId} disabled variant="label-stacked">
                        </lightning-input-field>
                        <template if:true={hasEnquiryLineItems}>
                            <lightning-combobox name="enquiryLineItems" label="Select Enquiry Stop"
                                placeholder="Select Stop" options={options} disabled onchange={handleStopChange}
                                required>
                            </lightning-combobox>
                        </template>
                        <div class="slds-grid">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input-field field-name="Port__c" value={currentOfferLineItem.Port__c}
                                    required disabled variant="label-stacked">
                                </lightning-input-field>
                                <lightning-input-field field-name="Product2Id" value={currentOfferLineItem.Product2Id}
                                    required disabled read-only variant="label-stacked">
                                </lightning-input-field>
                                <lightning-input-field field-name="Quantity" value={currentOfferLineItem.Quantity}
                                    required variant="label-stacked">
                                </lightning-input-field>
                                <lightning-input-field class="slds-p-horizontal_xx-small" field-name="IsQuantityRange__c"
                                    value={currentOfferLineItem.IsQuantityRange__c} onchange={handleQuantityRangeChange}
                                    variant="label-stacked">
                                </lightning-input-field>
                                <div class="slds-m-top_large">
                                    <template if:true={currentOfferLineItem.IsQuantityRange__c}>
                                        <lightning-input-field field-name="Quantity_Range_Maximum__c"
                                            value={currentOfferLineItem.Quantity_Range_Maximum__c} required
                                            variant="label-stacked">
                                        </lightning-input-field>
                                    </template>
                                    <lightning-input type="date" 
                                                    label="Expected Delivery Date"
                                                    date-style="short"
                                                    variant="label-stacked" 
                                                    value={currentOfferLineItem.Expected_Delivery_Date__c}
                                                    required
                                                    disabled
                                                    onchange={handleChangeExpectedDeliverynDate}>
                                    </lightning-input>
                                </div>
                                <lightning-input-field field-name="Unit_of_Measure__c"
                                    value={currentOfferLineItem.Unit_of_Measure__c} required variant="label-stacked">
                                </lightning-input-field>         
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input-field field-name="Supplier__c" value={currentOfferLineItem.Supplier__c}
                                    variant="label-stacked">
                                </lightning-input-field>
                                <lightning-input-field field-name="BDN_Company__c" value={currentOfferLineItem.BDN_Company__c}
                                    variant="label-stacked">
                                </lightning-input-field>
                                <lightning-input-field field-name="Suppliers_Broker__c"
                                    value={currentOfferLineItem.Suppliers_Broker__c} variant="label-stacked">
                                </lightning-input-field>
                                <lightning-input-field field-name="Supplier_Payment_Term__c"
                                                       value={currentOfferLineItem.Supplier_Payment_Term__c}
                                                       variant="label-stacked"
                                                       disabled>
                                </lightning-input-field>
                                <lightning-input-field field-name="Transportation_Type_Buy__c" value={currentOfferLineItem.Transportation_Type_Buy__c}
                                    onchange={handleTransportationBuyChange} variant="label-stacked">
                                </lightning-input-field>
                                <c-fcb-offer-broker-pricing-input field-label="Unit (Buy At)"
                                    field-name="Supplier_Unit_Price__c" decimal-places=3 step=0.001 min=0.000
                                    initial-value={supplierUnitPrice} onchange={calculateFormulas}>
                                </c-fcb-offer-broker-pricing-input>
                                <c-fcb-offer-broker-pricing-input field-label="Supplier's Broker Commission"
                                    field-name="Supplier_Broker_Commission__c" decimal-places=3 step=0.001 min=0.000
                                    initial-value={currentOfferLineItem.Supplier_Broker_Commission__c}
                                    onchange={calculateFormulas} disabled={disabledSupplierBrokerComm}>
                                </c-fcb-offer-broker-pricing-input>
                                <div style="margin-top: 10px;">
                                    <lightning-input-field field-name="Partial_CIA__c"
                                        value={currentOfferLineItem.Partial_CIA__c} variant="label-stacked" disabled>
                                    </lightning-input-field>   
                                </div>
                                <div style="margin-top: 21px;">
                                    <lightning-input-field field-name="Partial_Lumpsum_Buy_At__c"
                                        value={currentOfferLineItem.Partial_Lumpsum_Buy_At__c} variant="label-stacked" disabled>
                                    </lightning-input-field>
                                </div>
                                
                                <lightning-input-field field-name="Add_Supplier_Bid_To_Quote__c"
                                    value={currentOfferLineItem.Add_Supplier_Bid_To_Quote__c} variant="label-stacked">
                                </lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-record-edit-form object-api-name="Quote" record-id={quote.Id}>
                                    <lightning-input-field field-name="Quote_Buyer__c"
                                                          variant="label-stacked"
                                                          style="margin-top: 62px;"
                                                          disabled>
                                    </lightning-input-field>
                                    <lightning-input-field field-name="Broker__c"
                                                          variant="label-stacked"
                                                          disabled>
                                    </lightning-input-field>
                                </lightning-record-edit-form>                               
                                <lightning-combobox name="paymentTermPicklist"
                                                    label="Buyer Payment Term"
                                                    value={currentOfferLineItem.Buyer_Payment_Term__c}
                                                    placeholder="Select Payment Term"
                                                    options={paymentTermOptions}
                                                    required="true"
                                                    onchange={handlePaymentTermChange}>
                                </lightning-combobox>
                                <lightning-input-field class="slds-m-top_x-small" field-name="Transportation_Type_Sell__c" value={currentOfferLineItem.Transportation_Type_Sell__c}
                                    onchange={handleTransportationSellChange} variant="label-stacked">
                                </lightning-input-field>
                                <c-fcb-offer-broker-pricing-input field-label="Unit (Sell At)" field-name="UnitPrice"
                                    decimal-places=3 step=0.001 min=0.000 required initial-value={unitPrice}
                                    onchange={calculateFormulas}>
                                </c-fcb-offer-broker-pricing-input>
                                <c-fcb-offer-broker-pricing-input field-label={buyerBrokerCommissionLabel}
                                    field-name="Buyer_Broker_Commission__c" decimal-places=3 step=0.001 min=0.000
                                    initial-value={currentOfferLineItem.Buyer_Broker_Commission__c}
                                    onchange={calculateFormulas} disabled={disabledBuyerBrokerComm}>
                                </c-fcb-offer-broker-pricing-input>
                                <template for:each={quoteBuyerBrokers} for:item="quoteBuyerBroker">
                                    <lightning-input class="slds-m-top_x-small slds-p-left_xx-small slds-p-right_xx-small" key={quoteBuyerBroker.Id} type="number" step=".001"
                                        label={quoteBuyerBroker.label} value={quoteBuyerBroker.commission} onchange={handleChangeBuyerBrokerCommission} data-id={quoteBuyerBroker.Id}>
                                    </lightning-input>
                                </template>
                                <div style="margin-top: 10px;">
                                    <lightning-input-field field-name="Partial_Buyer_CIA__c"
                                        value={currentOfferLineItem.Partial_Buyer_CIA__c} variant="label-stacked">
                                    </lightning-input-field>   
                                </div>
                                <div style="margin-top: 21px;">
                                    <lightning-input-field field-name="Partial_Lumpsum_Sell_At__c"
                                        value={currentOfferLineItem.Partial_Lumpsum_Sell_At__c} variant="label-stacked" disabled={isDisabledPartialCIA}>
                                    </lightning-input-field>
                                </div>
                                <lightning-input class="slds-m-top_x-small"
                                                 type="date" 
                                                 label="Validity Date" 
                                                 date-style="short" 
                                                 variant="label-stacked" 
                                                 value={currentOfferLineItem.Validity_Date__c} 
                                                 onchange={handleChangeExpirationDate}>
                                </lightning-input>
                                <lightning-input name="Validity_Time__c" class="slds-p-horizontal_xx-small"  
                                                label="Validity Time" value={currentOfferLineItem.Validity_Time__c} type="time">
                                </lightning-input>
                            </div>
                        </div>
                        <lightning-input-field field-name="Supplier_Constraints__c"
                            value={currentOfferLineItem.Supplier_Constraints__c} variant="label-stacked">
                        </lightning-input-field>
                        <input type="submit" class="hidden-btn" />
                    </lightning-record-edit-form>
                </template>
            </div>
            <c-fcb-offer-line-item-extra-costs quote-id={recordId} quote-line-item={currentOfferLineItem}>
            </c-fcb-offer-line-item-extra-costs>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_success" onclick={handleAddAction}>Save</button>
                <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
