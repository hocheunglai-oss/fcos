name: FCOS quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact HTTPS preview URL built for this commit
        required: true
        type: string
      preview_sha:
        description: Full 40-character Git SHA the supplied preview was built from
        required: true
        type: string

concurrency:
  group: fcos-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:fcuno-contract
      - run: npm run verify:compatibility
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:graph-only
      - run: npm run build
      - run: npm run verify:performance
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: FCOS_MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres FCOS_REQUIRE_LIVE_MIGRATION_CHECK=1 npm run verify:migrations
      - name: Stop temporary Supabase services
        if: ${{ always() }}
        run: supabase stop --no-backup

  authenticated-browser:
    # Browser verification is release-only. PR/push quality never creates or
    # uses test credentials, and this manual entry point needs an exact preview.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      FCOS_AUTH_E2E_ENABLED: ${{ vars.FCOS_AUTH_E2E_ENABLED }}
      FCOS_E2E_BASE_URL: ${{ inputs.preview_url }}
      FCOS_E2E_PREVIEW_SHA: ${{ inputs.preview_sha }}
      FCOS_RELEASE_SHA: ${{ github.sha }}
      FCOS_E2E_STORAGE_STATE: /tmp/fcos-e2e-storage.json
      FCOS_E2E_EMAIL: ${{ secrets.FCOS_E2E_EMAIL }}
      FCOS_E2E_PASSWORD: ${{ secrets.FCOS_E2E_PASSWORD }}
      FCOS_REQUIRE_AUTH_E2E: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Verify preview provenance and renewable browser credentials
        run: |
          test "$FCOS_AUTH_E2E_ENABLED" = "true"
          test -n "$FCOS_E2E_BASE_URL"
          test -n "$FCOS_E2E_PREVIEW_SHA"
          test "$FCOS_E2E_PREVIEW_SHA" = "$FCOS_RELEASE_SHA"
          case "$FCOS_E2E_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          test "$FCOS_E2E_BASE_URL" != "https://fcos.fcuno.com"
          test -n "$FCOS_E2E_EMAIL"
          test -n "$FCOS_E2E_PASSWORD"
      - run: npm run test:e2e

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # FCOS is a Vite SPA and does not enable React Router Server Components/actions.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
