name: FCOS quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: fcos-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-and-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # PR code must not receive a reusable GitHub credential through git.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:fcuno-contract
        env:
          # Read-only token required to fetch FCUNO's pinned contract. It is
          # intentionally neither a repository secret nor persisted by git.
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:graph-only
      - run: npm run build
      - run: npm run verify:performance
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - id: start-supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: FCOS_MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres FCOS_REQUIRE_LIVE_MIGRATION_CHECK=1 npm run verify:migrations
      - name: Stop temporary Supabase services
        if: ${{ always() && steps.start-supabase.outcome != 'skipped' && steps.start-supabase.outcome != '' }}
        run: supabase stop --no-backup

  # Stage one installs the trusted harness. Authenticated evidence consumption
  # is installed separately after an owner-reviewed default-branch run exists.

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # FCOS is a Vite SPA and does not enable React Router Server Components/actions.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
