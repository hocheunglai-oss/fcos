# One-time qualification bootstrap template, not an installed Actions workflow.
# Replace every controller placeholder with the admitted immutable controller.
# Publish only as authenticated-release.yml on the separately admitted protected qualification branch.
# Admission binds that branch/commit/candidate/setup; Production authority is never available.
# Original warm start only waits on public fixed refs/source proof until a
# separately guarded native request exists. Its dispatch never approves a step.
# Owner readback is a separate root-admitted finite orchestration dispatch. It
# cannot submit a financial step; OIDC authenticates source/run, not input mode.
name: FCOS hosted qualification bootstrap
run-name: ${{ inputs.xero_recovery_mode == 'original-warm' && format('FCOS original Xero carrier {0}', inputs.xero_original_warm_dispatch_id) || inputs.bootstrap_phase == 'toolchain' && format('FCOS toolchain {0}', inputs.intent_sha256) || format('FCOS hosted qualification {0}', inputs.candidate_sha || 'resume saved manifest') }}
'on':
  workflow_dispatch:
    inputs:
      bootstrap_phase:
        description: Read-only setup discovery, one-time immutable dependency archive/image publication or actual qualification; never Production.
        type: choice
        default: qualification
        options:
          - qualification
          - toolchain
          - dependency-key
          - dependency-setup
          - setup-discovery
          - preservation-preflight
      intent_sha256:
        description: Exact held legacy publication intent; required only for the toolchain phase.
        type: string
        required: false
      candidate_sha:
        description: Exact reviewed candidate SHA for a new release.
        type: string
        required: false
      plan:
        description: Reviewed JSON business release plan. Required for a new release.
        type: string
        required: false
      resume_manifest:
        description: Saved unchanged release manifest for recovery. Do not generate a new release ID.
        type: string
        required: false
      xero_recovery_mode:
        description: Separate finite orchestration purposes; disabled for qualification. No financial authority.
        type: choice
        default: disabled
        options:
          - disabled
          - owner-readback
          - original-warm
      xero_original_warm_dispatch_id:
        description: Native one-time public correlation UUID, never authority; original template comes only from the admitted repository variable.
        type: string
        required: false
      xero_recovery_template_base64:
        description: Exact original trusted public carrier template from the native readback admission.
        type: string
        required: false
      xero_recovery_readback_base64:
        description: Exact finite public owner-readback scope; contains no credential or request authority.
        type: string
        required: false
permissions: {}
jobs:
  toolchain:
    if: ${{ inputs.xero_recovery_mode == 'disabled' && inputs.bootstrap_phase == 'toolchain' }}
    permissions:
      contents: read
      actions: read
      packages: write
    uses: hocheunglai-oss/fcos/.github/workflows/hosted-release-toolchain.yml@7ecd4084d5c7b1cf1d458f2a72f209b267960d34
    with:
      source_sha: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
      intent_sha256: ${{ inputs.intent_sha256 }}
  dependency_setup:
    name: Dependency setup archive
    if: ${{ inputs.xero_recovery_mode == 'disabled' && inputs.bootstrap_phase == 'dependency-setup' && vars.FCOS_ADMITTED_DEPENDENCY_SEED != '' && vars.FCOS_ADMITTED_DEPENDENCY_SEED_SHA256 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FCOS_CONTROLLER_DIRECTORY: controller
      FCOS_CONTROLLER_SHA: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
      FCOS_ADMITTED_DEPENDENCY_SEED: ${{ vars.FCOS_ADMITTED_DEPENDENCY_SEED }}
      FCOS_ADMITTED_DEPENDENCY_SEED_SHA256: ${{ vars.FCOS_ADMITTED_DEPENDENCY_SEED_SHA256 }}
      FCOS_DEPENDENCY_SEED_SOURCE: bootstrap/.github/qualification/dependency-setup
      FCOS_DEPENDENCY_SEED_OUTPUT: dependency-setup
      FCOS_DEPENDENCY_SEED_RECEIPT: dependency-setup-receipt.json
      GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Check out admitted controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Check out immutable dependency source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: ${{ github.sha }}
          path: bootstrap
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/qualification/dependency-setup
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Stage verified dependency setup
        run: node controller/scripts/hosted-release-dependency-seed.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('fcos-dependency-setup-{0}', github.run_id) }}
          path: dependency-setup
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('fcos-dependency-setup-receipt-{0}', github.run_id) }}
          path: dependency-setup-receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
  dependency_key:
    name: Dependency recipient key
    if: ${{ inputs.xero_recovery_mode == 'disabled' && inputs.bootstrap_phase == 'dependency-key' && vars.FCOS_ADMITTED_DEPENDENCY_SEED != '' && vars.FCOS_ADMITTED_DEPENDENCY_SEED_SHA256 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FCOS_CONTROLLER_DIRECTORY: controller
      FCOS_CONTROLLER_SHA: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
      FCOS_ADMITTED_DEPENDENCY_SEED: ${{ vars.FCOS_ADMITTED_DEPENDENCY_SEED }}
      FCOS_ADMITTED_DEPENDENCY_SEED_SHA256: ${{ vars.FCOS_ADMITTED_DEPENDENCY_SEED_SHA256 }}
      FCOS_DEPENDENCY_KEY_OUTPUT: dependency-recipient.json
      GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Check out admitted controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Derive admitted recipient public key
        run: node controller/scripts/hosted-release-dependency-seed.mjs --recipient
        env:
          FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('fcos-dependency-key-{0}', github.run_id) }}
          path: dependency-recipient.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
  setup_discovery:
    name: Setup discovery
    if: ${{ inputs.xero_recovery_mode == 'disabled' && inputs.bootstrap_phase == 'setup-discovery' && vars.FCOS_HOSTED_SETUP_DISCOVERY_ADMITTED == 'true' }}
    runs-on: ubuntu-24.04
    environment: fcos-hosted-verification
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FCOS_SETUP_DISCOVERY_BOOTSTRAP: 'true'
      FCOS_HOSTED_SETUP_DISCOVERY_ADMITTED: ${{ vars.FCOS_HOSTED_SETUP_DISCOVERY_ADMITTED }}
      FCOS_HOSTED_ENVIRONMENT: fcos-hosted-verification
      FCOS_CONTROLLER_DIRECTORY: controller
      FCOS_CANDIDATE_DIRECTORY: candidate
      FCOS_CONTROLLER_SHA: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
      FCOS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      FCOS_ADMITTED_DISCOVERY_SETUP: ${{ vars.FCOS_ADMITTED_DISCOVERY_SETUP }}
      FCOS_ADMITTED_DISCOVERY_SETUP_SHA256: ${{ vars.FCOS_ADMITTED_DISCOVERY_SETUP_SHA256 }}
      FCOS_DISCOVERY_OUTPUT: setup-discovery.json
    steps:
      - name: Check out admitted controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install admitted controller dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: controller
      - name: Admit discovery before candidate checkout
        run: node controller/scripts/hosted-release-manifest.mjs --discover-setup --validate-dispatch-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: ${{ env.FCOS_CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install trusted runtime browser
        run: npx --no-install playwright install --with-deps chromium
        working-directory: controller
      - name: Discover public setup baseline
        run: node controller/scripts/hosted-release-manifest.mjs --discover-setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
          FCOS_HOSTED_VERCEL_READ_TOKEN: ${{ secrets.FCOS_HOSTED_VERCEL_READ_TOKEN }}
          FCOS_HOSTED_SCHEMA_DATABASE_URL: ${{ secrets.FCOS_HOSTED_SCHEMA_DATABASE_URL }}
          FCOS_PRODUCTION_VERIFICATION_BYPASS: ${{ secrets.FCOS_PRODUCTION_VERIFICATION_BYPASS }}
          FCOS_HOSTED_RUNTIME_EMAIL: ${{ secrets.FCOS_HOSTED_RUNTIME_EMAIL }}
          FCOS_HOSTED_RUNTIME_PASSWORD: ${{ secrets.FCOS_HOSTED_RUNTIME_PASSWORD }}
          FCOS_HOSTED_RUNTIME_EXPECTED_ROLE: ${{ vars.FCOS_HOSTED_RUNTIME_EXPECTED_ROLE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: ${{ format('fcos-setup-discovery-{0}', github.run_id) }}
          path: setup-discovery.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
  preservation_preflight:
    name: Preservation preflight
    if: ${{ inputs.xero_recovery_mode == 'disabled' && inputs.bootstrap_phase == 'preservation-preflight' && vars.FCOS_HOSTED_PRESERVATION_PREFLIGHT_ADMITTED == 'true' }}
    runs-on: ubuntu-24.04
    environment: fcos-hosted-dependency-verification
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FCOS_SETUP_DISCOVERY_BOOTSTRAP: 'true'
      FCOS_HOSTED_PRESERVATION_PREFLIGHT_ADMITTED: ${{ vars.FCOS_HOSTED_PRESERVATION_PREFLIGHT_ADMITTED }}
      FCOS_HOSTED_ENVIRONMENT: fcos-hosted-dependency-verification
      FCOS_CONTROLLER_DIRECTORY: controller
      FCOS_CANDIDATE_DIRECTORY: candidate
      FCOS_CONTROLLER_SHA: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
      FCOS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      FCOS_ADMITTED_PRESERVATION_PREFLIGHT: ${{ vars.FCOS_ADMITTED_PRESERVATION_PREFLIGHT }}
      FCOS_ADMITTED_PRESERVATION_PREFLIGHT_SHA256: ${{ vars.FCOS_ADMITTED_PRESERVATION_PREFLIGHT_SHA256 }}
      FCOS_PRESERVATION_PREFLIGHT_OUTPUT: preservation-preflight.json
    steps:
      - name: Check out admitted controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install admitted controller dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: controller
      - name: Admit preservation preflight before candidate checkout
        run: node controller/scripts/hosted-preservation-preflight.mjs --validate-dispatch-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: ${{ env.FCOS_CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Observe preservation without release authority
        run: node controller/scripts/hosted-preservation-preflight.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
          FCOS_HOSTED_PRESERVATION_DATABASE_URL: ${{ secrets.FCOS_HOSTED_PRESERVATION_DATABASE_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: ${{ format('fcos-preservation-preflight-{0}', github.run_id) }}
          path: preservation-preflight.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
  manifest:
    name: Prepare immutable release manifest
    if: ${{ inputs.xero_recovery_mode == 'disabled' && inputs.bootstrap_phase == 'qualification' && vars.FCOS_HOSTED_QUALIFICATION_ADMITTED == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hocheunglai-oss/fcos-release-checks@sha256:1cb176a00c6224f94a668f76de51186e2d0b3cd95d631af4289467451caf40ef
      credentials:
        username: hocheunglai-oss
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001:1001
    defaults:
      run:
        shell: bash
    environment: fcos-hosted-verification
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    env:
      FCOS_QUALIFICATION_BOOTSTRAP: 'true'
      FCOS_HOSTED_QUALIFICATION_ADMITTED: ${{ vars.FCOS_HOSTED_QUALIFICATION_ADMITTED }}
      FCOS_CONTROLLER_DIRECTORY: controller
      FCOS_CANDIDATE_DIRECTORY: candidate
      FCOS_CONTROLLER_SHA: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
      FCOS_ADMITTED_RELEASE_SETUP: ${{ vars.FCOS_ADMITTED_RELEASE_SETUP }}
      FCOS_ADMITTED_RELEASE_SETUP_SHA256: ${{ vars.FCOS_ADMITTED_RELEASE_SETUP_SHA256 }}
      FCOS_CANDIDATE_SHA: ${{ fromJSON(inputs.resume_manifest || '{}').candidate.sha || inputs.candidate_sha }}
      FCOS_RELEASE_PLAN: ${{ inputs.plan }}
      FCOS_RESUME_MANIFEST: ${{ inputs.resume_manifest }}
    steps:
      - name: Check out admitted controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Install admitted controller dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: controller
      - name: Verify admitted trusted runtime
        timeout-minutes: 1
        run: |
          node --input-type=commonjs <<'NODE'
          const {accessSync,constants,readFileSync,realpathSync}=require('node:fs');
          const {spawnSync}=require('node:child_process');
          const playwright=require('playwright');
          if(process.version!=='v24.18.0'||process.platform!=='linux'||process.arch!=='x64'||process.getuid()!==1001||process.getgid()!==1001
            ||process.env.PLAYWRIGHT_BROWSERS_PATH!=='/ms-playwright'||require('playwright/package.json').version!=='1.62.1'
            ||JSON.parse(readFileSync('/usr/local/lib/node_modules/vercel/package.json','utf8')).version!=='54.20.1'
            ||realpathSync('/usr/local/bin/vercel')!=='/usr/local/lib/node_modules/vercel/dist/vc.js')throw Error('HOSTED_TRUSTED_TOOLCHAIN_MISMATCH');
          accessSync('/usr/local/bin/vercel',constants.X_OK);
          const chromium=playwright.chromium.executablePath();
          if(!chromium.startsWith('/ms-playwright/'))throw Error('HOSTED_TRUSTED_BROWSER_PATH');
          const python=spawnSync('/usr/bin/python3',['--version'],{encoding:'utf8',timeout:5000,maxBuffer:4096,env:{PATH:'/usr/local/bin:/usr/bin:/bin'}});
          if(python.status!==0||python.signal||python.error||python.stdout.trim()!=='Python 3.11.2')throw Error('HOSTED_TRUSTED_PYTHON_MISMATCH');
          for(const binary of [chromium,'/opt/google/chrome/chrome']){
            accessSync(binary,constants.X_OK);
            const result=spawnSync(binary,['--version'],{encoding:'utf8',timeout:5000,maxBuffer:4096,env:{PATH:'/usr/local/bin:/usr/bin:/bin'}});
            if(result.status!==0||result.signal||result.error||!/^(?:Chromium|Google Chrome(?: for Testing)?) [0-9]+\./.test(result.stdout.trim()))throw Error('HOSTED_TRUSTED_BROWSER_UNAVAILABLE');
          }
          console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,python:python.stdout.trim(),playwright:'1.62.1',vercel:'54.20.1',browserAvailabilityVerified:true}));
          NODE
        working-directory: controller
      - name: Admit qualification dispatch before candidate checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const resume = process.env.FCOS_RESUME_MANIFEST;
          const plan = process.env.FCOS_RELEASE_PLAN;
          if (!!resume === !!plan) throw new Error('Exactly one qualification plan or unchanged recovery manifest required');
          const value = JSON.parse(resume || plan);
          if (value.stage !== 'qualification' || (resume && value.executionMode !== 'qualification')
            || (value.executionMode !== undefined && value.executionMode !== 'qualification')) {
            throw new Error('Qualification-only bootstrap');
          }
          NODE
          node controller/scripts/hosted-release-manifest.mjs --validate-dispatch-only
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: ${{ env.FCOS_CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare actual qualification manifest
        id: manifest
        run: node controller/scripts/hosted-release-manifest.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
          FCOS_HOSTED_VERCEL_READ_TOKEN: ${{ secrets.FCOS_HOSTED_VERCEL_READ_TOKEN }}
          FCOS_HOSTED_SCHEMA_DATABASE_URL: ${{ secrets.FCOS_HOSTED_SCHEMA_DATABASE_URL }}
          FCOS_PRODUCTION_VERIFICATION_BYPASS: ${{ secrets.FCOS_PRODUCTION_VERIFICATION_BYPASS }}
          FCOS_HOSTED_RUNTIME_EMAIL: ${{ secrets.FCOS_HOSTED_RUNTIME_EMAIL }}
          FCOS_HOSTED_RUNTIME_PASSWORD: ${{ secrets.FCOS_HOSTED_RUNTIME_PASSWORD }}
          FCOS_HOSTED_RUNTIME_EXPECTED_ROLE: ${{ vars.FCOS_HOSTED_RUNTIME_EXPECTED_ROLE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('fcos-release-manifest-{0}', github.run_id) }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
  release:
    name: release
    needs:
      - manifest
    if: ${{ inputs.xero_recovery_mode == 'disabled' && inputs.bootstrap_phase == 'qualification' }}
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: hocheunglai-oss/fcos/.github/workflows/hosted-release-controller.yml@7ecd4084d5c7b1cf1d458f2a72f209b267960d34
    with:
      manifest: ${{ needs.manifest.outputs.manifest }}
    # Values remain in each called job's protected environment; no secrets: inherit.
    secrets:
      FCOS_E2E_VERCEL_BYPASS: ${{ secrets.FCOS_E2E_VERCEL_BYPASS }}
      FCOS_HOSTED_FCUNO_READ_TOKEN: ${{ secrets.FCOS_HOSTED_FCUNO_READ_TOKEN }}
      FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
      FCOS_HOSTED_NORMAL_EMAIL: ${{ secrets.FCOS_HOSTED_NORMAL_EMAIL }}
      FCOS_HOSTED_NORMAL_PASSWORD: ${{ secrets.FCOS_HOSTED_NORMAL_PASSWORD }}
      FCOS_HOSTED_PRESERVATION_DATABASE_URL: ${{ secrets.FCOS_HOSTED_PRESERVATION_DATABASE_URL }}
      FCOS_HOSTED_RESTRICTED_EMAIL: ${{ secrets.FCOS_HOSTED_RESTRICTED_EMAIL }}
      FCOS_HOSTED_RESTRICTED_FALLBACK_EMAIL: ${{ secrets.FCOS_E2E_EMAIL }}
      FCOS_HOSTED_RESTRICTED_FALLBACK_PASSWORD: ${{ secrets.FCOS_E2E_PASSWORD }}
      FCOS_HOSTED_RESTRICTED_PASSWORD: ${{ secrets.FCOS_HOSTED_RESTRICTED_PASSWORD }}
      FCOS_HOSTED_RUNTIME_EMAIL: ${{ secrets.FCOS_HOSTED_RUNTIME_EMAIL }}
      FCOS_HOSTED_RUNTIME_PASSWORD: ${{ secrets.FCOS_HOSTED_RUNTIME_PASSWORD }}
      FCOS_HOSTED_SALESFORCE_CLIENT_SECRET: ${{ secrets.FCOS_HOSTED_SALESFORCE_CLIENT_SECRET }}
      FCOS_HOSTED_SCHEMA_DATABASE_URL: ${{ secrets.FCOS_HOSTED_SCHEMA_DATABASE_URL }}
      FCOS_HOSTED_VERCEL_READ_TOKEN: ${{ secrets.FCOS_HOSTED_VERCEL_READ_TOKEN }}
      FCOS_HOSTED_VERCEL_TOKEN: ${{ secrets.FCOS_HOSTED_VERCEL_TOKEN }}

  xero_owner_readback:
    name: xero-owner-readback
    if: ${{ inputs.xero_recovery_mode == 'owner-readback' && inputs.bootstrap_phase == 'qualification' && inputs.xero_recovery_template_base64 != '' && inputs.xero_recovery_readback_base64 != '' }}
    permissions:
      contents: read
      actions: read
      statuses: read
      id-token: write
    uses: hocheunglai-oss/fcos/.github/workflows/hosted-xero-recovery-carrier.yml@7ecd4084d5c7b1cf1d458f2a72f209b267960d34
    with:
      controller_sha: 7ecd4084d5c7b1cf1d458f2a72f209b267960d34
      template_base64: ${{ inputs.xero_recovery_template_base64 }}
      # Hardcoded purpose: no dispatch input can select the POST entrypoint.
      mode: owner-readback
      owner_readback_base64: ${{ inputs.xero_recovery_readback_base64 }}
    secrets:
      FCOS_HOSTED_VERCEL_READ_TOKEN: ${{ secrets.FCOS_HOSTED_VERCEL_READ_TOKEN }}
      FCOS_HOSTED_RUNTIME_EMAIL: ${{ secrets.FCOS_HOSTED_RUNTIME_EMAIL }}
      FCOS_HOSTED_RUNTIME_PASSWORD: ${{ secrets.FCOS_HOSTED_RUNTIME_PASSWORD }}
