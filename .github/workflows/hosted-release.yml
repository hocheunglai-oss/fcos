# The controller pin is intentionally independent of later main commits.
# Enable only after isolated setup and reviewed admission. Qualification cannot promote Production.
name: FCOS hosted release
run-name: ${{ format('FCOS hosted release {0}', inputs.candidate_sha || 'resume saved manifest') }}
'on':
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed candidate SHA for a new release.
        type: string
        required: false
      plan:
        description: Reviewed JSON business release plan. Required for a new release.
        type: string
        required: false
      resume_manifest:
        description: Saved unchanged release manifest for recovery. Do not generate a new release ID.
        type: string
        required: false
permissions: {}
jobs:
  manifest:
    name: Prepare immutable release manifest
    if: ${{ vars.FCOS_HOSTED_CONTROLLER_ADMITTED == 'true' }}
    runs-on: ubuntu-24.04
    environment: fcos-hosted-verification
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    env:
      FCOS_CONTROLLER_DIRECTORY: controller
      FCOS_CANDIDATE_DIRECTORY: candidate
      FCOS_CONTROLLER_SHA: bbc5e6b1c0f9211d4f7d8a6e5f8acaccd15b9681
      FCOS_ADMITTED_RELEASE_SETUP: ${{ vars.FCOS_ADMITTED_RELEASE_SETUP }}
      FCOS_ADMITTED_RELEASE_SETUP_SHA256: ${{ vars.FCOS_ADMITTED_RELEASE_SETUP_SHA256 }}
      FCOS_CANDIDATE_SHA: ${{ fromJSON(inputs.resume_manifest || '{}').candidate.sha || inputs.candidate_sha }}
      FCOS_RELEASE_PLAN: ${{ inputs.plan }}
      FCOS_RESUME_MANIFEST: ${{ inputs.resume_manifest }}
    steps:
      - name: Check out admitted controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: bbc5e6b1c0f9211d4f7d8a6e5f8acaccd15b9681
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Validate dispatch inputs before reading candidate
        run: >-
          node --input-type=module <<'NODE'

          if (!/^[a-f0-9]{40}$/.test(process.env.FCOS_CANDIDATE_SHA || '') || process.env.GITHUB_REF !==
          'refs/heads/main' || process.env.GITHUB_REF_PROTECTED !== 'true') throw new Error('Admitted protected main and
          exact candidate SHA required');

          if (!!process.env.FCOS_RESUME_MANIFEST === !!process.env.FCOS_RELEASE_PLAN) throw new Error('Provide one new
          plan or one unchanged recovery manifest');

          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: ${{ env.FCOS_CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install admitted controller dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: controller
      - name: Install trusted runtime browser
        run: npx --no-install playwright install --with-deps chromium
        working-directory: controller
      - name: Prepare actual manifest
        id: manifest
        run: node controller/scripts/hosted-release-manifest.mjs
        env:
          FCOS_HOSTED_VERCEL_TOKEN: ${{ secrets.FCOS_HOSTED_VERCEL_READ_TOKEN }}
          FCOS_HOSTED_VERCEL_TOKEN_ID: ${{ vars.FCOS_HOSTED_VERCEL_READ_TOKEN_ID }}
          FCOS_HOSTED_SCHEMA_DATABASE_URL: ${{ secrets.FCOS_HOSTED_SCHEMA_DATABASE_URL }}
          FCOS_PRODUCTION_VERIFICATION_BYPASS: ${{ secrets.FCOS_PRODUCTION_VERIFICATION_BYPASS }}
          FCOS_HOSTED_RUNTIME_EMAIL: ${{ secrets.FCOS_HOSTED_RUNTIME_EMAIL }}
          FCOS_HOSTED_RUNTIME_PASSWORD: ${{ secrets.FCOS_HOSTED_RUNTIME_PASSWORD }}
          FCOS_HOSTED_RUNTIME_EXPECTED_ROLE: ${{ vars.FCOS_HOSTED_RUNTIME_EXPECTED_ROLE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('fcos-release-manifest-{0}', github.run_id) }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
  release:
    name: release
    needs:
      - manifest
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: hocheunglai-oss/fcos/.github/workflows/hosted-release-controller.yml@bbc5e6b1c0f9211d4f7d8a6e5f8acaccd15b9681
    with:
      manifest: ${{ needs.manifest.outputs.manifest }}
    secrets:
      FCOS_HOSTED_GITHUB_READ_TOKEN: ${{ secrets.FCOS_HOSTED_GITHUB_READ_TOKEN }}
