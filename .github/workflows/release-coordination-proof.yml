name: FCOS protected artifact coordination proof
on:
  workflow_dispatch:
concurrency:
  group: fcos-production-release
  cancel-in-progress: false
permissions:
  contents: read
# Inert until exact source and root-held coordination/action are separately admitted.
# This workflow receives no Vercel credential and cannot create or resolve a lease.
jobs:
  proof:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.FCOS_RELEASE_COORDINATION_PROOF_ENABLED == 'true' && vars.FCOS_RELEASE_COORDINATION_PROOF_HARNESS_SHA == github.sha }}
    runs-on: ubuntu-latest
    environment: fcos-production-release
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: trusted
      - uses: ./trusted/.github/actions/release-executor
        with:
          route: proof
        env:
          GH_TOKEN: ${{ secrets.FCOS_RELEASE_GH_TOKEN }}
      - name: Retain sanitized actual backend observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fcos-coordination-proof-result-${{ github.run_id }}
          path: ${{ runner.temp }}/fcos-coordination-proof-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
