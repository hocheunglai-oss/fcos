name: FCOS Trading FX signing receipt recovery
run-name: Recover FCOS Trading FX signing 43620608639
on:
  workflow_dispatch:
    inputs:
      plan_json:
        description: Original approved signing plan
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: fcos-production-release
  cancel-in-progress: false
  queue: max

jobs:
  recover-signing-receipt:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected && github.actor == 'hocheunglai-oss' && github.triggering_actor == 'hocheunglai-oss' && github.repository == 'hocheunglai-oss/fcos'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: fcos-production-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: recovery
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d7e269328d399967aaa09be51406c9b7cc4a43d6
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b495d1bde6d06834c32212982c4597e20e6c7fe0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install trusted dependencies and provider CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix recovery
          npm install --global vercel@54.20.1 @salesforce/cli@2.145.6 --ignore-scripts --no-audit --no-fund
          node --input-type=module -e 'import {loadSigningSalesforceConnection} from "./recovery/scripts/lib/rapid-release/trading-fx-signing-setup-salesforce.mjs";loadSigningSalesforceConnection(process.argv[1])' "$(npm root -g)"
      - name: Read original provider outcomes and complete the signing receipt
        run: |
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync(process.env.FCOS_RAPID_DATABASE_CA,process.env.FCOS_CA,{mode:0o600,flag:"wx"})'
          node recovery/scripts/rapid-release-trading-fx-signing-setup.mjs
        env:
          FCOS_SIGNING_RECOVER_RECEIPT: 'true'
          FCOS_SIGNING_PLAN_JSON: ${{ inputs.plan_json }}
          FCOS_SIGNING_PLAN_HASH: 6fb68b5db025ad84cc0f557488914cf097e23af634bf22ed14beb21105405db0
          FCOS_SIGNING_OWNER_TOKEN: ${{ secrets.FCOS_RAPID_HANDOVER_GITHUB_TOKEN || secrets.FCOS_RELEASE_GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.FCOS_RELEASE_VERCEL_TOKEN }}
          FCOS_RAPID_DATABASE_URL: ${{ secrets.FCOS_RAPID_READONLY_DATABASE_URL }}
          FCOS_RAPID_DATABASE_CA: ${{ runner.temp }}/trading-fx-signing-ca.pem
          FCOS_CA: ${{ secrets.FCOS_RAPID_DATABASE_CA }}
          FCOS_RAPID_SALESFORCE_PRODUCTION_PRIVATE_KEY: ${{ secrets.FCOS_RAPID_SALESFORCE_PRODUCTION_PRIVATE_KEY }}
          FCOS_RAPID_SALESFORCE_PRODUCTION_CLIENT_ID: ${{ secrets.FCOS_RAPID_SALESFORCE_PRODUCTION_CLIENT_ID }}
