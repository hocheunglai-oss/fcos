# One-time setup only. The dispatcher retains the canonical provider-write lease
# through registry readback. Disable and inventory this writer before cutover.
name: FCOS hosted verification toolchain setup
run-name: FCOS toolchain ${{ inputs.intent_sha256 }}
'on':
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      intent_sha256:
        required: true
        type: string
permissions: {}
concurrency:
  group: fcos-hosted-toolchain-setup
  cancel-in-progress: false
jobs:
  build:
    if: ${{ vars.FCOS_HOSTED_TOOLCHAIN_SETUP_ENABLED == 'true' && github.repository == 'hocheunglai-oss/fcos' && github.repository_id == '1278654816' && github.actor == 'hocheunglai-oss' && github.actor_id == '265701760' && github.triggering_actor == 'hocheunglai-oss' && github.ref_protected && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
      guard_sha256: ${{ steps.build.outputs.guard_sha256 }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      INTENT_SHA256: ${{ inputs.intent_sha256 }}
      ADMITTED_SOURCE_SHA: ${{ vars.FCOS_HOSTED_TOOLCHAIN_SOURCE_SHA }}
      ADMITTED_INTENT_SHA256: ${{ vars.FCOS_HOSTED_TOOLCHAIN_INTENT_SHA256 }}
      FCOS_HOSTED_TOOLCHAIN_BOOTSTRAP: ${{ vars.FCOS_HOSTED_TOOLCHAIN_BOOTSTRAP }}
      FCOS_HOSTED_TOOLCHAIN_BOOTSTRAP_SHA256: ${{ vars.FCOS_HOSTED_TOOLCHAIN_BOOTSTRAP_SHA256 }}
    steps:
      - name: Admit immutable setup source and existing write intent
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ || "$SOURCE_SHA" != "$ADMITTED_SOURCE_SHA" || ! "$INTENT_SHA256" =~ ^[a-f0-9]{64}$ || "$INTENT_SHA256" != "$ADMITTED_INTENT_SHA256" ]]; then
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hocheunglai-oss/fcos
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Admit exact protected qualification bootstrap context
        run: node --input-type=module -e 'import {toolchainSourceContext} from "./scripts/hosted-toolchain-admission.mjs"; toolchainSourceContext(process.env)'
      - name: Build without registry or provider credentials
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p toolchain-output
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/hocheunglai-oss/fcos" --label "org.opencontainers.image.revision=$SOURCE_SHA" -f deploy/hosted-checks.Dockerfile -t fcos-release-checks:setup .
          image_id=$(docker image inspect fcos-release-checks:setup --format '{{.Id}}')
          test "$(docker image inspect "$image_id" --format '{{.Config.User}}')" = '1001:1001'
          docker run --rm --network none "$image_id" node --version | tee toolchain-output/node-version.txt
          docker run --rm --network none "$image_id" python3 --version | tee toolchain-output/python-version.txt
          docker run --rm --network none "$image_id" vercel --version > toolchain-output/vercel-version.txt 2>&1
          test "$(cat toolchain-output/node-version.txt)" = 'v24.18.0'
          docker save "$image_id" | gzip -1 > toolchain-output/image.tar.gz
          archive_sha256=$(sha256sum toolchain-output/image.tar.gz | cut -d' ' -f1)
          cp scripts/hosted-toolchain-admission.mjs toolchain-output/admission.mjs
          guard_sha256=$(sha256sum toolchain-output/admission.mjs | cut -d' ' -f1)
          printf 'image_id=%s\narchive_sha256=%s\nguard_sha256=%s\n' "$image_id" "$archive_sha256" "$guard_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fcos-toolchain-setup-image
          path: toolchain-output/
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      INTENT_SHA256: ${{ inputs.intent_sha256 }}
      ADMITTED_SOURCE_SHA: ${{ vars.FCOS_HOSTED_TOOLCHAIN_SOURCE_SHA }}
      FCOS_HOSTED_TOOLCHAIN_BOOTSTRAP: ${{ vars.FCOS_HOSTED_TOOLCHAIN_BOOTSTRAP }}
      FCOS_HOSTED_TOOLCHAIN_BOOTSTRAP_SHA256: ${{ vars.FCOS_HOSTED_TOOLCHAIN_BOOTSTRAP_SHA256 }}
      IMAGE_ID: ${{ needs.build.outputs.image_id }}
      ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
      GUARD_SHA256: ${{ needs.build.outputs.guard_sha256 }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fcos-toolchain-setup-image
          path: toolchain-output
      - name: Verify saved image before private registry access
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ || ! "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ || ! "$GUARD_SHA256" =~ ^[a-f0-9]{64}$ ]]; then exit 1; fi
          printf '%s  toolchain-output/image.tar.gz\n' "$ARCHIVE_SHA256" | sha256sum --check --strict
          printf '%s  toolchain-output/admission.mjs\n' "$GUARD_SHA256" | sha256sum --check --strict
          gzip -dc toolchain-output/image.tar.gz | docker load
          test "$(docker image inspect "$IMAGE_ID" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE_ID" --format '{{.Config.User}}')" = '1001:1001'
          test "$(docker image inspect "$IMAGE_ID" --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
      - name: Reject a consumed publication intent using complete hosted history
        run: node toolchain-output/admission.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish exact image once and read immutable registry digest
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/fcos-toolchain-registry
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username hocheunglai-oss --password-stdin
          unset REGISTRY_TOKEN
          image="ghcr.io/hocheunglai-oss/fcos-release-checks:setup-${SOURCE_SHA}-${GITHUB_RUN_ID}"
          docker tag "$IMAGE_ID" "$image"
          printf '{"sourceSha":"%s","intentSha256":"%s","imageId":"%s","archiveSha256":"%s","tag":"%s","runId":"%s","status":"submitting"}\n' "$SOURCE_SHA" "$INTENT_SHA256" "$IMAGE_ID" "$ARCHIVE_SHA256" "$image" "$GITHUB_RUN_ID" > toolchain-output/publication.json
          # No retry. An uncertain push stays under the original operator intent.
          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | node --input-type=module -e 'import{readFileSync}from"node:fs";const d=JSON.parse(readFileSync(0,"utf8")).digest;if(!/^sha256:[a-f0-9]{64}$/.test(d||""))process.exit(1);console.log(d)')
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const p=JSON.parse(readFileSync("toolchain-output/publication.json","utf8"));p.status="registry_readback_verified";p.registryDigest=process.argv[1];writeFileSync("toolchain-output/publication.verified.json",JSON.stringify(p)+"\n")' "$digest"
          printf 'Published `%s@%s`. Setup evidence only; hosted qualification and admission remain required.\n' "${image%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: fcos-toolchain-publication
          path: |
            toolchain-output/publication*.json
            toolchain-output/*-version.txt
          if-no-files-found: error
          retention-days: 90
